# herdr-plugin.toml - manifest for herdr-tasks.
#
# A task list for the agent you are watching, in a split pane beside it.
#
# One writer, one reader. An agent publishes its list with the `herdr-tasks` CLI,
# which the bundled skill teaches it to use, and that lands in a per-pane JSON file
# under the plugin's state directory. The pane watches that directory.
#
# An earlier design mirrored Claude Code's TodoWrite tool through a PostToolUse
# hook, which needed nothing from the agent. It was removed: TodoWrite is disabled
# by default in current Claude Code, replaced by TaskCreate/TaskGet/TaskList/
# TaskUpdate, and a session with no task tool at all emits nothing to hook. The CLI
# works for every agent, so it is the only path.
#
# Nothing here runs on its own. The pane opens only from the toggle action (bind it
# to a key), and the skill and shim are only written when the setup action is
# invoked. The one [[startup]] entry re-points an ALREADY installed shim and skill
# at the current checkout after a reinstall, and does nothing otherwise.
#
# Node, no dependencies: Herdr plugins run as ordinary processes, and a task list
# does not justify a toolchain. Requires Node 18 or newer, which is also what
# Claude Code needs, so on any machine running it the runtime is already there.

id = "pinkpixel.herdr-tasks"
name = "Herdr Tasks"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Watch an agent work through its task list in a split pane, checked off as it goes."
platforms = ["linux", "macos", "windows"]

# The pane. `title` is what Herdr sets as the pane label, and the toggle finds
# the pane by that label - keep the two in step (see bin/toggle.js PANE_LABEL).
# `placement = "split"` makes it an ordinary Herdr pane, so it resizes, moves and
# zooms with the normal Herdr keys.
[[panes]]
id = "tasks"
title = "Tasks"
placement = "split"
command = ["node", "bin/pane.js"]

# The one key you press. Open if this tab has no task pane, close if it does.
# Opens without taking focus, so you can keep typing to the agent.
[[actions]]
id = "toggle"
title = "Tasks: toggle the pane"
description = "Open the task list beside the focused pane, or close it if it is already open in this tab."
contexts = ["pane"]
command = ["node", "bin/toggle.js"]

# Writes outside the plugin's own directories: the user's skill directories, and a
# shim in the plugin config directory. Explicit action, never automatic.
[[actions]]
id = "configure"
title = "Set up: install the agent skill and the CLI shim"
description = "Install the herdr-tasks skill so your agents know how to publish a task list, write the CLI shim, and seed config.toml. Prints the keybinding to add."
contexts = ["global"]
command = ["node", "bin/configure.js", "--apply"]

[[actions]]
id = "unconfigure"
title = "Set up: remove the agent skill and the CLI shim"
description = "Remove the skill this plugin installed and delete the shim. Your config.toml and saved lists stay."
contexts = ["global"]
command = ["node", "bin/configure.js", "--uninstall"]

# A reinstall lands the plugin in a new managed directory, which leaves the
# absolute paths inside the installed skill and shim pointing at the old one. This
# refreshes both on the next server start, and exits quietly when nothing is
# installed.
[[startup]]
command = ["node", "bin/configure.js", "--repair"]
